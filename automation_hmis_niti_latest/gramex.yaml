  # production_db_connection: mysql://root:password@localhost/prod_db_sep

url:
  uphealth_automation-home:
    pattern: /$YAMLURL/
    handler: FileHandler
    kwargs:
      path: $YAMLPATH/index.html
      # See https://learn.gramener.com/guide/auth/#authorization for auth rules
      auth: &AUTH
        login_url: /$YAMLURL/login/
      template: ["index.html", "template*.html"]
      headers:
        # Templates may have user-specific content. Cache privately.
        # Keep max-age small (in case we log out & log in as another user.)
        Cache-Control: private, max-age=1
    cache: { expiry: { duration: 1 } }

  uphealth_automation-login:
    pattern: /$YAMLURL/login/
    # You MUST change the auth before deploying. DBAuth is commonly used.
    # See https://learn.gramener.com/guide/auth/#database-auth
    handler: SimpleAuth
    kwargs:
      template: $YAMLPATH/login.html
      credentials:
        alpha: alpha
        beta: beta

  uphealth_automation-logout:
    pattern: /$YAMLURL/logout/
    handler: LogoutHandler

  uphealth_automation-dashboard_indicators:
    pattern: /$YAMLURL/dashboard_indicator_names
    handler: FunctionHandler
    kwargs:
      auth: *AUTH
      function: automation_trigger.dashboard_indicator_names(handler)

  up-tsu-desktop/tmp_test:
    pattern: /$YAMLURL/tmp_test
    handler: FormHandler
    kwargs:
      url: $staging_db_connection
      query: "select * from tmp_test"

  uphealth_automation-fetch_indicators_data:
    pattern: /$YAMLURL/fetch_indicators_data
    handler: FunctionHandler
    kwargs:
      auth: *AUTH
      function: automation_trigger.fetch_indicators_data(handler)
      method: "POST"

  uphealth_automation-retryfetchIndicators:
    pattern: /$YAMLURL/retryfetchIndicators
    handler: FunctionHandler
    kwargs:
      auth: *AUTH
      function: automation_trigger.fetch_indicators_data(handler, True)
      method: "POST"

  uphealth_automation-download_data:
    pattern: /$YAMLURL/download_data
    handler: FunctionHandler
    kwargs:
      auth: *AUTH
      function: automation_trigger.download_data(handler)
      method: "POST"

  uphealth_automation-start_save_process:
    pattern: /$YAMLURL/start_save_process
