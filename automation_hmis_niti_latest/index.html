<body>
  {% set base = '.' %}

  {% set username = user_info.get('user', '') %}
  {% include template-navbar.html %}
    <div class="upload_screen_loader">
      <div class="loader h-100">
        <div class="d-flex h-100 w-100 flex-column flex-column align-items-center justify-content-center">
          <img src="./assets/images/loading_icon.svg" class="pos-cc" alt="loader">
          <!-- <strong>Loading..</strong> -->
        </div>
      </div>
    </div>
  <!-- TODO: Filter bars -->
  <div class="container-fluid p-0">
    <div class="d-flex col-12 px-0">

  </div><!-- .container-fluid -->

  <!-- History Screen -->
  <div class="modal fade" id="HistoryModal" tabindex="-1" role="dialog" aria-labelledby="HistoryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="HistoryModalTitle">History</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <table class="table table-striped table-bordered w-100" id="dataupdatedHistory_table">
            <thead>
              <tr>
                <th width="20%">Dashboard Name</th>
                <th width="10%">From Date</th>
                <th width="10%">To Date</th>
                <th width="25%">Time</th>
                <th width="15%">Stage</th>
                <th width="15%">Action</th>
              </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
        </div>
        <!-- <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-dismiss="modal">Ok</button>
        </div> -->
      </div>
    </div>
  </div>

  <!-- File Upload Screen -->
  <script type="text/html" src="templates/upload.html" id="upload_files"></script>

  <script type="text/javascript" src="node_modules/dropzone/dist/min/dropzone.min.js"></script>
  <script type="text/javascript" src="js/common.js"></script>
