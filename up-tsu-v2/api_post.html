<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>UP-TSU | API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui/bootstraptheme.css?primary=%230776FF&secondary=%23EAEEF2&success=%23F5F5F5&info=%238EF0FF&warning=%23EC6D43&danger=%234D4742&light=%23ffffff&dark=%23000000&body-bg=%23ffffff&font-family-base=open-sans&">
</head>
  <script src="ui/jquery/dist/jquery.min.js"></script>
  <script src="ui/bootstrap/dist/js/bootstrap.min.js"></script>
  <script src="ui/g1/dist/g1.min.js"></script>
<body>
  <a href="./">Back to main page </a>
  <form>
    <input placeholder="send popup msg" id="token">
    <button type="button" id="submit">Submit</button>
  </form>
  <h4 class="Success"></h4>
  <script type="text/javascript">
    $('#submit').click(function(){
      $.ajax("notification?msg="+$('#token').val(), {
        method: 'GET',
        success: function () {
          $('.Success').html('POPUP Notification Sent Successfully')
          $('#token').val('')
        }
      })
    })
  </script>
</body>
</html>
