  bmgf-up-tsu-login:
    pattern: /$YAMLURL/login
    handler: DBAuth
    kwargs:
      session_inactive: 0.013 # 20 mins,  unit is days
      url: $connection_str
      table: user_details
      user:
        column: user
        arg: user
      delay: [0, 0, 0, 0, 58]
      password:
        column: password
        arg: password
        # hash: true
      template: $YAMLPATH/login.html # This has the login form
