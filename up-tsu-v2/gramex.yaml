  bmfg-up-tsu-maps-page:
    pattern: /$YAMLURL/maps_data
    handler: FormHandler
    kwargs:
      indicators:
        url: $YAMLPATH/data/district_scores.csv
      auth: *AUTH
    # cache: true

  bmgf-up-tsu-last-update:
    pattern: /$YAMLURL/last_update
    handler: FormHandler
    kwargs:
      # url: $YAMLPATH/data/district_scores.csv
      url: $connection_str
      query: select max(date) as date from fact_phase1_district_data_monthly
      modify: up_tsu_app.get_last_update(data)
      auth: *AUTH
      default:
        _limit: 100000
    # cache: true

  bmgf-up-tsu-version:
    pattern: /$YAMLURL/version
    handler: FunctionHandler
    kwargs:
      function: up_tsu_app.get_version
      auth: *AUTH
      headers:
        Content-Type: application/json

  bmgf-up-tsu-mapview/district_level:
    pattern: /$YAMLURL/district_level
    handler: FileHandler
    kwargs:
      path: $YAMLPATH/data/up-districts-view.json
      auth: *AUTH
      headers:
        Cache-Control: public, max-age=315360000 # Cache for 10 years on the browser
    cache: true

  bmgf-up-tsu-mapview/division_level:
    pattern: /$YAMLURL/division_level
    handler: FileHandler
    kwargs:
      path: $YAMLPATH/data/up-divisions.topo.json
      auth: *AUTH
      headers:
        Cache-Control: public, max-age=315360000 # Cache for 10 years on the browser
    cache: true

  bmgf-up-tsu-mapview/block_level:
    pattern: /$YAMLURL/block_level
    handler: FileHandler
    kwargs:
      path: $YAMLPATH/data/up-districts-blocks-view.json
      auth: *AUTH
      headers:
        Cache-Control: public, max-age=315360000 # Cache for 10 years on the browser
    cache: true

  bmgf-up-tsu/div-dist-map:
    pattern: /$YAMLURL/div_dist_map
    handler: FormHandler
    kwargs:
      url: $connection_str # $YAMLPATH/data/divisions-districts-mapping.csv
      query:
