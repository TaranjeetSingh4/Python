# block analytics month
block_score_by_type_month:
  SELECT DATE_FORMAT(t1.date, '%Y-%m-%d') AS date, avg(t1.perc_point) as perc_point,
  t2.block_name as block, t2.type_name as type, t2.indicator_name as indicator
  FROM fact_phase1_block_data_monthly t1
  left join dim_phase1_block_data t2
  on t2.block_id_num = t1.block_id_num
  and t2.indicator_id = t1.indicator_id
  {where_clause}
  group by t1.date, t2.block_name, t2.type_name
  # where (t1.date='{from_date}' or t1.date='{to_date}')

