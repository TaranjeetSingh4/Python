quaterly-districts:
  SELECT d.calc_type, f.composite_index, f.composite_rank, f.date,
  d.district_name AS district, d.district_id, d.div_map_id, d.division_name AS division,
  d.domain_name AS domain, f.domain_index, f.domain_rank, d.indicator_name AS indicator,
  d.indicator_id, d.indicator_id AS indicator_ids, f.indicator_index, f.indicator_rank,
  d.map_id, f.perc_point, f.quarter, d.type_name AS type_, f.type_index, f.type_rank, f.year
  FROM dim_phase1_district_data as d
  JOIN fact_phase1_district_data_quaterly as f
  ON d.district_id_num = f.district_id_num
  AND
  d.indicator_id = f.indicator_id {where};

