<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>UP-TSU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui/bootstraptheme.css?primary=%2348A3D4&secondary=%23AFAFAF&success=%23767676&info=%238EF0FF&warning=%23F9A77E&danger=%23FB3353&light=%23ffffff&dark=%23000000&body-bg=%23ffffff&font-family-base=open-sans&">
  <link rel="stylesheet" href="ui/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <link rel="stylesheet" type="text/css" href="ui/noty/lib/noty.css">
</head>

<body class="body-bg bg-no-repeat vh-100">
  <div class="px-0">
    <div class="d-flex align-self-center vh-100">
      <div class="col-12 align-self-center px-0">
        <div class="card bg-transparent no-border-radius border-0 login">
          <div class="mb-4">
            <h3 class="text-uppercase text-warning text-center mb-0">Reset Pasword</h3>
          </div>
          <div class="px-4 mb-5">
            <p class=" text-warning text-center mb-0"></p>
          </div>
          <div class="verify-otp">
              <form class="login-input" method="POST">
                <input type="hidden" name="_xsrf" value="{{ handler.xsrf_token }}">
                <div class=" w-75 mx-auto mb-5">
                  <input type="text" class="bg-transparent border border-warning border-top-0 border-left-0 border-right-0 h5 no-border-radius text-light text-center w-100 pb-3 font-weight-light" id="otp" placeholder="Enter OTP here" name="otp" autocomplete="off">
                </div>
                <div class="text-center">
                  <button type="submit" class="no-border-radius border-0 h5 py-4 mb-0 btn-light font-weight-light w-100 text-uppercase text-danger" id="verify">Verify OTP</button>
                </div>
              </form>
          </div>
          <div class="set-password d-none">
            <form class="login-input" method="POST">
                <input type="hidden" name="_xsrf" value="{{ handler.xsrf_token }}">
                <div class=" w-75 mx-auto mb-5">
                  <input type="password" class="bg-transparent border border-warning border-top-0 border-left-0 border-right-0 h5 no-border-radius text-light text-center w-100 pb-3 font-weight-light" id="password" placeholder="new password" name="password" autocomplete="off">
                </div>
                <div class=" w-75 mx-auto mb-5">
                  <input type="password" class="bg-transparent border border-warning border-top-0 border-left-0 border-right-0 h5 no-border-radius text-light text-center w-100 pb-3 font-weight-light" id="re-password" placeholder="re-enter password" name="password" autocomplete="off">
                </div>
                <div class="text-center">
                  <button type="submit" id="enter" class="no-border-radius border-0 h5 py-4 mb-0 btn-light font-weight-light w-100 text-uppercase text-danger">Save password</button>
                  <small class="form-text text-white text-center">You will be redirected to login page up on save</small>
                </div>
              </form>
            </div>
          </div>
      </div>
    </div>
  </div>
</body>
<script src="ui/jquery/dist/jquery.min.js"></script>
<script src="ui/popper.js/dist/umd/popper.min.js"></script>
<script src="ui/bootstrap/dist/js/bootstrap.min.js"></script>
<script src="ui/noty/lib/noty.min.js"></script>
<script src="ui/g1/dist/g1.min.js"></script>
<script src="js/login.js"></script>
<script src="node_modules/crypto-js/crypto-js.js"></script>
<!--
  D3: ui/d3/build/d3.min.js
  Lodash: ui/lodash/lodash.min.js
  Moment: ui/moment/min/moment-with-locales.min.js
  Noty: ui/noty/lib/noty.min.js
  Daterangepicker: ui/daterangepicker/daterangepicker.js
  Leaflet: ui/leaflet/dist/leaflet.js
  TopoJSON: ui/topojson/dist/topojson.min.js
  g1: ui/g1/dist/g1.min.js
-->

</html>
