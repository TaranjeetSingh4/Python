<!--Calendar-->
<div class="card no-border-radius border-0 bg-transparent py-2">
    <div class="container-fluid">
        <div class="row d-flex justify-content-between">
            <div class="col-4 pr-0">
                <div class="d-flex bg-light-1 pb-2 pt-1 px-1 btn">
                    <div class="col-3 px-0 text-right">
                        <img src="img/calendar.png" alt="calendar" width="23" height="22">
                    </div>
                    <div class="col-9 pr-0 pl-1 align-self-center mt-1 calendar">
                        <p class="p-6 mb-0 text-uppercase text-left">Performance for</p>
                        <p class="p-8 mb-0 text-uppercase font-weight-bold text-left"><span class="curr">Feb 18</span></p>
                    </div>
                </div>
            </div>
            <div class="col-4 pl-1 pr-0">
                <div class="d-flex bg-light-1 pb-2 pt-1 px-1 btn">
                    <div class="col-3 px-0 text-right">
                        <img src="img/calendar.png" alt="calendar" width="23" height="22">
                    </div>
                    <div class="col-8 pr-0 pl-1 align-self-center mt-1 calendar">
                        <p class="p-6 mb-0 text-uppercase text-left">Compared to</p>
                        <p class="p-8 mb-0 text-uppercase font-weight-bold text-left"><span class="prev">Jan 18</span></p>
                    </div>
                </div>
            </div>
            <div class="col-4 pl-0 align-self-center">
                <div class="d-flex justify-content-end">
                    <div class="col px-2 text-right">
                        <!-- <img src="img/insight.png" alt="insight" width="20" height="22" id="p"> -->
                        <img src="img/insight.png" alt="insight" width="20" height="22" data-toggle="modal" data-target=".bd-overlay-sm-right">
                    </div>
                    <div class="col px-0  text-right download">
                        <a><img src="img/download.png" alt="download" width="24" height="22" id="download_png" class="screen-shot"></a>
                    </div>
                </div>
                <div class="right">
                    <div class="modal fade bd-overlay-sm-right modal-right" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel">
                        <div class="modal-dialog w-50 modal-md text-white rounded tail-lt">
                            <div class="modal-content pb-3 rounded-0">
                                <div class="modal-body cutsom-overflow-right p-0">
                                    <div class="container-fluid  bg-light vh-100 px-0">
                                        <div class="row bg-gradient py-3 mx-0">
                                            <div class="col-10 pr-0 align-self-center">
                                                <p class="text-light mb-0 p-12">Quickstats</p>
                                            </div>
                                            <div class="col-2 pl-0 align-self-center">
                                                <div class="close-icon">
                                                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                          </button>
                                                </div>
                                            </div>
                                            <div class="nav-area pt-2">
                                                <ul class="nav d-flex flex-column bg-light">
                                                    <% _.each(insights_data, function(d){ %>
                                                        <li class="nav-item">
                                                            <a class="nav-link px-3 text-dark p-11 border border-secondary border-left-0 border-right-0 border-top-0" href="#"><span class="font-weight-bold"><%- d.per %></span><%- d.name %> </a>
                                                        </li>
                                                        <% }) %>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
